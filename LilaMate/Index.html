
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LilaMate ♟️</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <div class="logo">♔ ♕</div>

        <h1>LilaMate</h1>

        <p data-i18n="subtitle">
            Un pequeño mundo de ajedrez en colores pastel
        </p>
    </header>

    <main class="app">

        <!-- CONTROLES -->
        <section class="controls">

            <select id="language">
                <option value="es">🇪🇸 Español</option>
                <option value="en">🇬🇧 English</option>
                <option value="pt">🇧🇷 Português</option>
            </select>

            <button id="themeBtn" class="btn lila">
                🌙 <span data-i18n="theme">Modo noche</span>
            </button>

            <button id="modeBtn" class="btn rosa">
                🤖 <span data-i18n="computer">
                    Contra computadora
                </span>
            </button>

            <button id="suggestBtn" class="btn yellow">
                💡 <span data-i18n="suggestions">
                    Sugerencias: ON
                </span>
            </button>

            <button id="newGameBtn" class="btn green">
                🔄 <span data-i18n="newGame">
                    Nueva partida
                </span>
            </button>

            <button id="saveBtn" class="btn">
                💾 <span data-i18n="save">Guardar</span>
            </button>

            <button id="loadBtn" class="btn">
                📂 <span data-i18n="load">Cargar</span>
            </button>

        </section>


        <!-- JUEGO -->
        <section class="game-layout">

            <!-- TABLERO -->
            <div class="board-card">

                <div class="status">

                    <span id="turnText">
                        Turno: Blancas
                    </span>

                    <span id="modeText">
                        🤖 Computadora
                    </span>

                </div>

                <div id="board"></div>

            </div>


            <!-- INFORMACIÓN -->
            <aside class="side-card">

                <h2 data-i18n="gameInfo">
                    Partida
                </h2>

                <div class="info-box">

                    <div class="info-label"
                         data-i18n="players">
                        Jugadores
                    </div>

                    <div class="info-value"
                         id="playersText">
                        Tú vs. Computadora
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label"
                         data-i18n="turn">
                        Turno
                    </div>

                    <div class="info-value"
                         id="turnSide">
                        Blancas
                    </div>

                </div>


                <h3 data-i18n="moves">
                    Movimientos
                </h3>

                <div id="moves"></div>


                <div id="suggestion"
                     class="suggestion">

                    💡

                    <strong data-i18n="suggestionTitle">
                        Sugerencia:
                    </strong>

                    <span id="suggestionText">
                        ...
                    </span>

                </div>

            </aside>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <span data-i18n="createdBy">
            Creado con ♡ por
        </span>

        <strong>Gradalki Sofia</strong>
        &amp;

        <strong>Texeira Ivana</strong>

        <br>

        <small>
            © 2026 LilaMate
        </small>

    </footer>


    <!-- MODAL -->
    <div class="modal" id="modal">

        <div class="modal-content">

            <h2 id="modalTitle">
                ♟️ Partida terminada
            </h2>

            <p id="modalText"></p>

            <button
                class="btn green"
                onclick="closeModal()">
                OK
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
